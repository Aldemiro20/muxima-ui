<button [ngClass]="getClasses()" [disabled]="disabled" type="{{type}}">
  <ng-container *ngIf="icon">
    <img *ngIf="iconPosition === 'left'" [src]="icon" alt="icon" class="icon">
  </ng-container>

  <span *ngIf="text">{{text}}</span>  

  <ng-container *ngIf="icon">
    <img *ngIf="iconPosition === 'right'" [src]="icon" alt="icon" class="icon">
  </ng-container>
</button>
