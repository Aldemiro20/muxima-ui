<!-- Linear Progress -->
<div *ngIf="type === 'linear'" class="muxima-progress-linear" [ngClass]="'muxima-progress-' + size">
  <div 
    class="muxima-progress-bar"
    [ngClass]="[
      'muxima-progress-' + color,
      striped ? 'muxima-progress-striped' : '',
      animated ? 'muxima-progress-animated' : ''
    ]"
    [style.width.%]="percentage">
  </div>
  <span *ngIf="showLabel" class="muxima-progress-label">{{ percentage | number:'1.0-0' }}%</span>
</div>

<!-- Circular Progress -->
<div *ngIf="type === 'circular'" class="muxima-progress-circular" [ngClass]="'muxima-progress-' + size">
  <svg viewBox="0 0 100 100">
    <defs>
      <linearGradient id="gradient-primary" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
      </linearGradient>
      <linearGradient id="gradient-success" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#22C55E;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
      </linearGradient>
      <linearGradient id="gradient-warning" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#FBBF24;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#FCD34D;stop-opacity:1" />
      </linearGradient>
      <linearGradient id="gradient-error" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#F87171;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#FCA5A5;stop-opacity:1" />
      </linearGradient>
    </defs>
    <circle
      class="muxima-progress-circle-bg"
      cx="50"
      cy="50"
      r="45"
      fill="none"
      stroke-width="8"
    ></circle>
    <circle
      class="muxima-progress-circle-bar"
      [ngClass]="'muxima-progress-' + color"
      cx="50"
      cy="50"
      r="45"
      fill="none"
      stroke-width="8"
      [style.stroke-dasharray]="2 * 3.14159 * 45"
      [style.stroke-dashoffset]="strokeDashoffset"
    ></circle>
  </svg>
  <div *ngIf="showLabel" class="muxima-progress-circular-label">{{ percentage | number:'1.0-0' }}%</div>
</div>
