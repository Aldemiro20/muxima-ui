<div class="credit-card-container" [class.disabled]="disabled">
  <!-- Visual Card -->
  <div class="card-visual" *ngIf="showCard" [class.flipped]="isFlipped">
    <div class="card-inner">
      <!-- Card Front -->
      <div class="card-face card-front" [attr.data-type]="cardData.type">
        <div class="card-background"></div>
        <div class="card-content">
          <div class="card-header">
            <span class="card-logo">{{ getCardLogo() }}</span>
            <span class="card-type">{{ cardData.type?.toUpperCase() || 'CARD' }}</span>
          </div>
          
          <div class="card-number" [class.focused]="focusedField === 'number'">
            {{ getMaskedNumber() }}
          </div>
          
          <div class="card-footer">
            <div class="card-holder" [class.focused]="focusedField === 'name'">
              <div class="card-label">NOME</div>
              <div class="card-value">{{ cardData.name || 'SEU NOME' }}</div>
            </div>
            <div class="card-expiry" [class.focused]="focusedField === 'expiry'">
              <div class="card-label">VALIDADE</div>
              <div class="card-value">{{ cardData.expiry || 'MM/AA' }}</div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Card Back -->
      <div class="card-face card-back">
        <div class="card-background"></div>
        <div class="magnetic-strip"></div>
        <div class="cvv-strip">
          <div class="cvv-label">CVV</div>
          <div class="cvv-value" [class.focused]="focusedField === 'cvv'">
            {{ cardData.cvv || '•••' }}
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Form Inputs -->
  <div class="card-form">
    <div class="form-group">
      <label>{{ labels.number }}</label>
      <input
        type="text"
        [disabled]="disabled"
        placeholder="1234 5678 9012 3456"
        maxlength="19"
        (input)="onNumberInput($event)"
        (focus)="onFieldFocus('number')"
        (blur)="onFieldBlur()"
        autocomplete="cc-number"
      />
    </div>

    <div class="form-group">
      <label>{{ labels.name }}</label>
      <input
        type="text"
        [disabled]="disabled"
        placeholder="Nome como está no cartão"
        (input)="onNameInput($event)"
        (focus)="onFieldFocus('name')"
        (blur)="onFieldBlur()"
        autocomplete="cc-name"
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>{{ labels.expiry }}</label>
        <input
          type="text"
          [disabled]="disabled"
          placeholder="MM/AA"
          maxlength="5"
          (input)="onExpiryInput($event)"
          (focus)="onFieldFocus('expiry')"
          (blur)="onFieldBlur()"
          autocomplete="cc-exp"
        />
      </div>

      <div class="form-group">
        <label>{{ labels.cvv }}</label>
        <input
          type="text"
          [disabled]="disabled"
          placeholder="123"
          [maxLength]="cardData.type === 'amex' ? 4 : 3"
          (input)="onCvvInput($event)"
          (focus)="onFieldFocus('cvv')"
          (blur)="onFieldBlur()"
          autocomplete="cc-csc"
        />
      </div>
    </div>
  </div>
</div>
