name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npx nx run-many --target=lint --all --parallel=3
      
      - name: Test
        run: npx nx run-many --target=test --all --parallel=3 --coverage
      
      - name: Build
        run: npx nx run-many --target=build --all --parallel=3
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: unittests
          name: muxima-ui-coverage

  affected:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - run: npm ci
      
      - name: Check affected projects
        run: |
          npx nx affected:dep-graph --base=origin/main --head=HEAD
          npx nx affected --target=lint --base=origin/main --head=HEAD
          npx nx affected --target=test --base=origin/main --head=HEAD
          npx nx affected --target=build --base=origin/main --head=HEAD
