name: CI

on:
  push:
    branches: [v2, main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # o npm 10.9 falha a instalar este workspace; o 11 resolve
      - run: npx -y npm@11 ci
      - name: Testes da biblioteca (comportamento, teclado e axe)
        run: npm test
      - name: Build da biblioteca
        run: npm run build:core
      - name: Build do site
        run: npm run build:docs
      - name: Acessibilidade em todas as páginas (claro e escuro)
        run: |
          npx playwright install --with-deps chromium
          npm run test:a11y
      - name: Testes end-to-end (teclado e sobreposições)
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
      - name: Conteúdo do pacote
        run: cd dist/core && npm pack --dry-run
