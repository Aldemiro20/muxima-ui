name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Packages to publish (comma-separated, or "all")'
        required: true
        default: 'all'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build packages
        run: npx nx run-many --target=build --all --parallel=3 --configuration=production
      
      - name: Run tests
        run: npx nx run-many --target=test --all --parallel=3
      
      - name: Version bump
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run version:bump -- --version ${{ github.event.inputs.version }}
      
      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.packages }}" == "all" ]; then
            npm run publish:all
          else
            IFS=',' read -ra PACKAGES <<< "${{ github.event.inputs.packages }}"
            for package in "${PACKAGES[@]}"; do
              npm run publish:package -- --name "$package"
            done
          fi
      
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.event.inputs.version }}
          release_name: Release v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
      
      - name: Commit and push changes
        if: github.event_name == 'workflow_dispatch'
        run: |
          git add .
          git commit -m "chore: release v${{ github.event.inputs.version }}" || echo "No changes to commit"
          git push origin main
          git push --tags
