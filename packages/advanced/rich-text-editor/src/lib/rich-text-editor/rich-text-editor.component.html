<div class="rich-text-editor" [class.disabled]="disabled">
  <div class="editor-container" [style.height]="height">
    <div #editor class="editor-content" [attr.contenteditable]="!readOnly && !disabled">
      <!-- Quill editor will be initialized here -->
      <p class="placeholder" *ngIf="!readOnly">{{ placeholder }}</p>
    </div>
  </div>
  
  <div class="editor-footer" *ngIf="showToolbar">
    <div class="character-count">
      <!-- Character count will be shown here -->
    </div>
  </div>
</div>

<!-- Note: In production, include Quill CSS -->
