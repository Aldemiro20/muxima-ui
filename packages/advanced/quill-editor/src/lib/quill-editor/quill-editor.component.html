<div class="quill-editor-wrapper" [class.disabled]="disabled || readOnly">
  <!-- Toolbar -->
  <div *ngIf="showToolbar" class="custom-toolbar">
    <!-- Formatação de Texto -->
    <div class="toolbar-group">
      <span class="toolbar-label">Formato</span>
      <select [(ngModel)]="currentFormat" (change)="setFormat(currentFormat)" class="toolbar-select">
        <option *ngFor="let fmt of formats" [value]="fmt.value">{{ fmt.label }}</option>
      </select>
    </div>

    <!-- Fonte -->
    <div class="toolbar-group">
      <span class="toolbar-label">Fonte</span>
      <select [(ngModel)]="currentFontFamily" (change)="setFontFamily(currentFontFamily)" class="toolbar-select font-select">
        <option *ngFor="let font of fontFamilies" [value]="font">{{ font }}</option>
      </select>
    </div>

    <!-- Tamanho -->
    <div class="toolbar-group">
      <span class="toolbar-label">Tamanho</span>
      <select [(ngModel)]="currentFontSize" (change)="setFontSize(currentFontSize)" class="toolbar-select size-select">
        <option *ngFor="let size of fontSizes" [value]="size">{{ size }}</option>
      </select>
    </div>

    <div class="toolbar-separator"></div>

    <!-- Estilos Básicos -->
    <div class="toolbar-group">
      <button (click)="toggleBold()" [class.active]="isBold" title="Negrito (Ctrl+B)" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M15.6,10.79C16.57,10.11 17.25,9 17.25,8C17.25,5.74 15.5,4 13.25,4H7V18H14.04C16.14,18 17.75,16.3 17.75,14.21C17.75,12.69 16.89,11.39 15.6,10.79M10,6.5H13C13.83,6.5 14.5,7.17 14.5,8C14.5,8.83 13.83,9.5 13,9.5H10V6.5M13.5,15.5H10V12.5H13.5C14.33,12.5 15,13.17 15,14C15,14.83 14.33,15.5 13.5,15.5Z" />
        </svg>
      </button>
      <button (click)="toggleItalic()" [class.active]="isItalic" title="Itálico (Ctrl+I)" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M10,4V7H12.21L8.79,15H6V18H14V15H11.79L15.21,7H18V4H10Z" />
        </svg>
      </button>
      <button (click)="toggleUnderline()" [class.active]="isUnderline" title="Sublinhado (Ctrl+U)" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M5,21H19V19H5V21M12,17A6,6 0 0,0 18,11V3H15.5V11A3.5,3.5 0 0,1 12,14.5A3.5,3.5 0 0,1 8.5,11V3H6V11A6,6 0 0,0 12,17Z" />
        </svg>
      </button>
      <button (click)="toggleStrike()" [class.active]="isStrike" title="Tachado" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M3,14H21V12H3M5,4V7H10V10H14V7H19V4M10,19H14V16H10V19Z" />
        </svg>
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <!-- Cores -->
    <div class="toolbar-group">
      <div class="color-picker-wrapper">
        <button (click)="showColorPicker = !showColorPicker" title="Cor do Texto" class="toolbar-btn color-btn">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M9.62,12L12,5.67L14.37,12M11,3L5.5,17H7.75L8.87,14H15.12L16.25,17H18.5L13,3H11Z" />
          </svg>
          <span class="color-indicator" [style.backgroundColor]="currentColor"></span>
        </button>
        <div *ngIf="showColorPicker" class="color-palette">
          <input type="color" [(ngModel)]="currentColor" (change)="setColor(currentColor)" class="color-input">
          <div class="preset-colors">
            <button *ngFor="let color of ['#000000', '#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#34495e']" 
                    (click)="setColor(color)" 
                    [style.backgroundColor]="color" 
                    class="preset-color"></button>
          </div>
        </div>
      </div>

      <div class="color-picker-wrapper">
        <button (click)="showBgColorPicker = !showBgColorPicker" title="Cor de Fundo" class="toolbar-btn color-btn">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M20,14H4V10H20M20,4H4A2,2 0 0,0 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V6A2,2 0 0,0 20,4Z" />
          </svg>
          <span class="color-indicator" [style.backgroundColor]="currentBgColor"></span>
        </button>
        <div *ngIf="showBgColorPicker" class="color-palette">
          <input type="color" [(ngModel)]="currentBgColor" (change)="setBgColor(currentBgColor)" class="color-input">
          <div class="preset-colors">
            <button *ngFor="let color of ['#ffffff', '#ffebee', '#e3f2fd', '#e8f5e9', '#fff3e0', '#f3e5f5', '#e0f2f1', '#eceff1']" 
                    (click)="setBgColor(color)" 
                    [style.backgroundColor]="color" 
                    class="preset-color"></button>
          </div>
        </div>
      </div>
    </div>

    <div class="toolbar-separator"></div>

    <!-- Alinhamento -->
    <div class="toolbar-group">
      <button (click)="setAlignment('left')" [class.active]="currentAlignment === 'left'" title="Alinhar à Esquerda" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M3,3H21V5H3V3M3,7H15V9H3V7M3,11H21V13H3V11M3,15H15V17H3V15M3,19H21V21H3V19Z" />
        </svg>
      </button>
      <button (click)="setAlignment('center')" [class.active]="currentAlignment === 'center'" title="Centralizar" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M3,3H21V5H3V3M7,7H17V9H7V7M3,11H21V13H3V11M7,15H17V17H7V15M3,19H21V21H3V19Z" />
        </svg>
      </button>
      <button (click)="setAlignment('right')" [class.active]="currentAlignment === 'right'" title="Alinhar à Direita" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M3,3H21V5H3V3M9,7H21V9H9V7M3,11H21V13H3V11M9,15H21V17H9V15M3,19H21V21H3V19Z" />
        </svg>
      </button>
      <button (click)="setAlignment('justify')" [class.active]="currentAlignment === 'justify'" title="Justificar" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M3,3H21V5H3V3M3,7H21V9H3V7M3,11H21V13H3V11M3,15H21V17H3V15M3,19H21V21H3V19Z" />
        </svg>
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <!-- Listas -->
    <div class="toolbar-group">
      <button (click)="insertOrderedList()" title="Lista Numerada" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M7,13H21V11H7M7,19H21V17H7M7,7H21V5H7M3,8V5H2V4H4V8M2,17V16H5V20H2V19H4V18.5H3V17.5H4V17M4.25,10A0.75,0.75 0 0,1 5,10.75C5,10.95 4.92,11.14 4.79,11.27L3.12,13H5V14H2V13.08L4,11H2V10H4.25Z" />
        </svg>
      </button>
      <button (click)="insertUnorderedList()" title="Lista com Marcadores" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M7,5H21V7H7V5M7,13V11H21V13H7M4,4.5A1.5,1.5 0 0,1 5.5,6A1.5,1.5 0 0,1 4,7.5A1.5,1.5 0 0,1 2.5,6A1.5,1.5 0 0,1 4,4.5M4,10.5A1.5,1.5 0 0,1 5.5,12A1.5,1.5 0 0,1 4,13.5A1.5,1.5 0 0,1 2.5,12A1.5,1.5 0 0,1 4,10.5M7,19V17H21V19H7M4,16.5A1.5,1.5 0 0,1 5.5,18A1.5,1.5 0 0,1 4,19.5A1.5,1.5 0 0,1 2.5,18A1.5,1.5 0 0,1 4,16.5Z" />
        </svg>
      </button>
      <button (click)="outdent()" title="Diminuir Recuo" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M11,13H21V11H11M11,9H21V7H11M3,3H21V5H3M11,17H21V15H11M3,8V16L7,12M3,21H21V19H3V21Z" />
        </svg>
      </button>
      <button (click)="indent()" title="Aumentar Recuo" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M11,13H21V11H11M11,9H21V7H11M3,3H21V5H3M11,17H21V15H11M3,12L7,8V16M3,21H21V19H3V21Z" />
        </svg>
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <!-- Inserções -->
    <div class="toolbar-group">
      <button (click)="openLinkModal()" title="Inserir Link (Ctrl+K)" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M3.9,12C3.9,10.29 5.29,8.9 7,8.9H11V7H7A5,5 0 0,0 2,12A5,5 0 0,0 7,17H11V15.1H7C5.29,15.1 3.9,13.71 3.9,12M8,13H16V11H8V13M17,7H13V8.9H17C18.71,8.9 20.1,10.29 20.1,12C20.1,13.71 18.71,15.1 17,15.1H13V17H17A5,5 0 0,0 22,12A5,5 0 0,0 17,7Z" />
        </svg>
      </button>
      <button (click)="openImageModal()" title="Inserir Imagem" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M8.5,13.5L11,16.5L14.5,12L19,18H5M21,19V5C21,3.89 20.1,3 19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19Z" />
        </svg>
      </button>
      <button (click)="openTableModal()" title="Inserir Tabela" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M5,4H19A2,2 0 0,1 21,6V18A2,2 0 0,1 19,20H5A2,2 0 0,1 3,18V6A2,2 0 0,1 5,4M5,8V12H11V8H5M13,8V12H19V8H13M5,14V18H11V14H5M13,14V18H19V14H13Z" />
        </svg>
      </button>
      <button (click)="insertBlockquote()" title="Citação" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M14,17H17L19,13V7H13V13H16M6,17H9L11,13V7H5V13H8L6,17Z" />
        </svg>
      </button>
      <button (click)="insertCodeBlock()" title="Bloco de Código" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M8,3A2,2 0 0,0 6,5V9A2,2 0 0,1 4,11H3V13H4A2,2 0 0,1 6,15V19A2,2 0 0,0 8,21H10V19H8V14A2,2 0 0,0 6,12A2,2 0 0,0 8,10V5H10V3M16,3A2,2 0 0,1 18,5V9A2,2 0 0,0 20,11H21V13H20A2,2 0 0,0 18,15V19A2,2 0 0,1 16,21H14V19H16V14A2,2 0 0,1 18,12A2,2 0 0,1 16,10V5H14V3H16Z" />
        </svg>
      </button>
      <button (click)="insertHorizontalRule()" title="Linha Horizontal" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M19,13H5V11H19V13Z" />
        </svg>
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <!-- Ações -->
    <div class="toolbar-group">
      <button (click)="toggleTheme()" [title]="isDarkTheme ? 'Mudar para Tema Claro' : 'Mudar para Tema Escuro'" class="toolbar-btn" [class.active]="!isDarkTheme">
        <svg *ngIf="isDarkTheme" viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M12,18C11.11,18 10.26,17.8 9.5,17.45C11.56,16.5 13,14.42 13,12C13,9.58 11.56,7.5 9.5,6.55C10.26,6.2 11.11,6 12,6A6,6 0 0,1 18,12A6,6 0 0,1 12,18M20,8.69V4H15.31L12,0.69L8.69,4H4V8.69L0.69,12L4,15.31V20H8.69L12,23.31L15.31,20H20V15.31L23.31,12L20,8.69Z" />
        </svg>
        <svg *ngIf="!isDarkTheme" viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,2L14.39,5.42C13.65,5.15 12.84,5 12,5C11.16,5 10.35,5.15 9.61,5.42L12,2M3.34,7L7.5,6.65C6.9,7.16 6.36,7.78 5.94,8.5C5.5,9.24 5.25,10 5.11,10.79L3.34,7M3.36,17L5.12,13.23C5.26,14 5.53,14.78 5.95,15.5C6.37,16.24 6.91,16.86 7.5,17.37L3.36,17M20.65,7L18.88,10.79C18.74,10 18.47,9.23 18.05,8.5C17.63,7.78 17.1,7.15 16.5,6.64L20.65,7M20.64,17L16.5,17.36C17.09,16.85 17.62,16.22 18.04,15.5C18.46,14.77 18.73,14 18.87,13.21L20.64,17M12,22L9.59,18.56C10.33,18.83 11.14,19 12,19C12.82,19 13.63,18.83 14.37,18.56L12,22Z" />
        </svg>
      </button>
      <button (click)="undo()" title="Desfazer (Ctrl+Z)" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M12.5,8C9.85,8 7.45,9 5.6,10.6L2,7V16H11L7.38,12.38C8.77,11.22 10.54,10.5 12.5,10.5C16.04,10.5 19.05,12.81 20.1,16L22.47,15.22C21.08,11.03 17.15,8 12.5,8Z" />
        </svg>
      </button>
      <button (click)="redo()" title="Refazer (Ctrl+Y)" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M18.4,10.6C16.55,9 14.15,8 11.5,8C6.85,8 2.92,11.03 1.54,15.22L3.9,16C4.95,12.81 7.95,10.5 11.5,10.5C13.45,10.5 15.23,11.22 16.62,12.38L13,16H22V7L18.4,10.6Z" />
        </svg>
      </button>
      <button (click)="clearFormatting()" title="Limpar Formatação" class="toolbar-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M6,5V5.18L8.82,8H11.22L10.5,9.68L12.6,11.78L14.21,8H20V5H6M3.27,5L2,6.27L8.97,13.24L6.5,19H9.5L11.07,15.34L16.73,21L18,19.73L3.55,5.27L3.27,5Z" />
        </svg>
      </button>
      <button (click)="clearContent()" title="Limpar Tudo" class="toolbar-btn danger">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Editor Content -->
  <div 
    #editorContent
    class="editor-content"
    [class.light-theme]="!isDarkTheme"
    [class.dark-theme]="isDarkTheme"
    [contentEditable]="!readOnly && !disabled"
    [attr.data-placeholder]="placeholder"
    [style.height]="height">
  </div>

  <!-- Footer com estatísticas -->
  <div class="editor-footer">
    <div class="stats">
      <span class="stat-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        {{ wordCount }} palavras
      </span>
      <span class="stat-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        {{ charCount }} caracteres
      </span>
    </div>
  </div>
</div>

<!-- Modal de Link -->
<div *ngIf="showLinkModal" class="modal-overlay" (click)="closeLinkModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Inserir Link</h3>
      <button (click)="closeLinkModal()" class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Texto</label>
        <input type="text" [(ngModel)]="linkText" placeholder="Texto do link" class="form-input">
      </div>
      <div class="form-group">
        <label>URL</label>
        <input type="url" [(ngModel)]="linkUrl" placeholder="https://exemplo.com" class="form-input">
      </div>
    </div>
    <div class="modal-footer">
      <button (click)="closeLinkModal()" class="btn btn-secondary">Cancelar</button>
      <button (click)="insertLink()" class="btn btn-primary">Inserir</button>
    </div>
  </div>
</div>

<!-- Modal de Imagem -->
<div *ngIf="showImageModal" class="modal-overlay" (click)="closeImageModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Inserir Imagem</h3>
      <button (click)="closeImageModal()" class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>URL da Imagem</label>
        <input type="url" [(ngModel)]="imageUrl" placeholder="https://exemplo.com/imagem.jpg" class="form-input">
      </div>
      <div *ngIf="imageUrl" class="image-preview">
        <img [src]="imageUrl" alt="Preview" style="max-width: 100%; max-height: 200px;">
      </div>
    </div>
    <div class="modal-footer">
      <button (click)="closeImageModal()" class="btn btn-secondary">Cancelar</button>
      <button (click)="insertImage()" class="btn btn-primary">Inserir</button>
    </div>
  </div>
</div>

<!-- Modal de Tabela -->
<div *ngIf="showTableModal" class="modal-overlay" (click)="closeTableModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Inserir Tabela</h3>
      <button (click)="closeTableModal()" class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Linhas</label>
        <input type="number" [(ngModel)]="tableRows" min="1" max="20" class="form-input">
      </div>
      <div class="form-group">
        <label>Colunas</label>
        <input type="number" [(ngModel)]="tableCols" min="1" max="10" class="form-input">
      </div>
    </div>
    <div class="modal-footer">
      <button (click)="closeTableModal()" class="btn btn-secondary">Cancelar</button>
      <button (click)="insertTable()" class="btn btn-primary">Inserir</button>
    </div>
  </div>
</div>
