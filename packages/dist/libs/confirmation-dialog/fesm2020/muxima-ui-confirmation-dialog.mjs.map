<div class="confirmation-dialog-container" *ngIf="isOpen">
  <div class="dialog-backdrop" (click)="cancel()"></div>

  <div class="dialog-panel" [class]="'variant-' + variant">
    <div class="dialog-icon">
      <span class="icon-emoji">{{ getVariantIcon() }}</span>
    </div>

    <div class="dialog-header">
      <h2 class="dialog-title">{{ title }}</h2>
    </div>

    <div class="dialog-content">
      <p class="dialog-message">{{ message }}</p>
    </div>

    <div class="dialog-footer">
      <button class="btn btn-cancel" (click)="cancel()">
        {{ cancelText }}
      </button>
      <button class="btn btn-confirm" [class]="'btn-' + variant" (click)="confirm()">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
