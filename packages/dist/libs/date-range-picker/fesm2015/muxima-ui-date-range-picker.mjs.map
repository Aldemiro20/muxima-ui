<div class="date-range-picker-wrapper">
  <div class="picker-input" (click)="togglePicker()" [class.disabled]="disabled">
    <svg class="calendar-icon" viewBox="0 0 24 24">
      <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
    </svg>
    <span class="selected-range">{{ formatRange() }}</span>
    <svg class="arrow-icon" [class.open]="isOpen" viewBox="0 0 24 24">
      <path d="M7 10l5 5 5-5z"/>
    </svg>
  </div>

  <div class="picker-dropdown" *ngIf="isOpen">
    <div class="picker-layout">
      <div *ngIf="showPresets" class="presets-panel">
        <h3 class="presets-title">Períodos</h3>
        <button
          *ngFor="let preset of presets"
          class="preset-btn"
          (click)="selectPreset(preset)"
        >
          {{ preset.label }}
        </button>
      </div>

      <div class="calendar-panel">
        <div class="calendar-header">
          <button class="nav-btn" (click)="previousMonth()">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <span class="month-year">
            {{ currentMonth.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }) }}
          </span>
          <button class="nav-btn" (click)="nextMonth()">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
          </button>
        </div>

        <div class="calendar-grid">
          <div class="weekday" *ngFor="let day of ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb']">
            {{ day }}
          </div>
          
          <button
            *ngFor="let date of getDaysInMonth()"
            class="day-cell"
            [class.in-range]="isInRange(date)"
            [class.start-date]="isStartDate(date)"
            [class.end-date]="isEndDate(date)"
            (click)="selectDate(date)"
          >
            {{ date.getDate() }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
