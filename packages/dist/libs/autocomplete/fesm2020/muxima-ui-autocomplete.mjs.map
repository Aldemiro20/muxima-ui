<div class="autocomplete-wrapper">
  <div class="autocomplete-input-container">
    <input
      type="text"
      class="autocomplete-input"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [(ngModel)]="searchTerm"
      (input)="onInput($event)"
      (keydown)="onKeyDown($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      autocomplete="off"
      role="combobox"
      [attr.aria-expanded]="isOpen"
      [attr.aria-autocomplete]="'list'"
    />
    
    <div class="autocomplete-icons">
      <svg *ngIf="loading" class="loading-spinner" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" />
      </svg>
      
      <svg *ngIf="!loading && searchTerm" class="clear-icon" (click)="searchTerm = ''; isOpen = false" viewBox="0 0 24 24">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
      
      <svg class="search-icon" viewBox="0 0 24 24">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
    </div>
  </div>

  <div class="autocomplete-dropdown" *ngIf="isOpen" role="listbox">
    <div
      *ngFor="let option of filteredOptions; let i = index"
      class="autocomplete-option"
      [class.highlighted]="i === highlightedIndex"
      [class.disabled]="option.disabled"
      (click)="selectOption(option)"
      role="option"
      [attr.aria-selected]="i === highlightedIndex"
    >
      <span [innerHTML]="highlightMatch(option.label)"></span>
    </div>

    <div *ngIf="filteredOptions.length === 0 && !loading" class="autocomplete-empty">
      {{ emptyMessage }}
    </div>
  </div>
</div>
