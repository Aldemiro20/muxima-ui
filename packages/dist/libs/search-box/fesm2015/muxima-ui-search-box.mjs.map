<div class="muxima-search-box" [ngClass]="[sizeClass, variantClass, isFocused ? 'focused' : '', disabled ? 'disabled' : '']">
  <!-- Search Icon -->
  <div class="search-icon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.35-4.35"></path>
    </svg>
  </div>

  <!-- Input -->
  <input
    type="text"
    class="search-input"
    [placeholder]="placeholder"
    [value]="searchValue"
    [disabled]="disabled"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />

  <!-- Loading Spinner -->
  <div *ngIf="loading" class="search-loading">
    <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none">
      <circle class="spinner-circle" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle>
    </svg>
  </div>

  <!-- Clear Button -->
  <button
    *ngIf="showClear && !loading"
    type="button"
    class="clear-button"
    (click)="onClear()"
    tabindex="-1"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</div>
