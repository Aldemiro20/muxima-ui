<div class="drawer-container" *ngIf="isOpen">
  <div 
    *ngIf="hasBackdrop" 
    class="drawer-backdrop" 
    (click)="onBackdropClick()"
    [@fadeIn]
  ></div>

  <div 
    class="drawer-panel" 
    [class.position-left]="position === 'left'"
    [class.position-right]="position === 'right'"
    [class.position-top]="position === 'top'"
    [class.position-bottom]="position === 'bottom'"
    [ngStyle]="getDrawerStyle()"
    [@slideIn]="position"
  >
    <div class="drawer-header">
      <ng-content select="[drawer-header]"></ng-content>
      
      <button class="drawer-close" (click)="close()" aria-label="Close drawer">
        <svg viewBox="0 0 24 24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>

    <div class="drawer-content">
      <ng-content></ng-content>
    </div>

    <div class="drawer-footer">
      <ng-content select="[drawer-footer]"></ng-content>
    </div>
  </div>
</div>
