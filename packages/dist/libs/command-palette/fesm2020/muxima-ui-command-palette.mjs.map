<div class="command-palette-wrapper" *ngIf="isOpen">
  <!-- Overlay -->
  <div class="command-overlay" (click)="onOverlayClick()"></div>

  <!-- Palette -->
  <div class="command-palette">
    <!-- Search Input -->
    <div class="command-search">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
      </svg>
      <input
        type="text"
        class="command-input"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange()"
        [placeholder]="placeholder"
        autofocus>
      <kbd class="shortcut-hint">ESC</kbd>
    </div>

    <!-- Results -->
    <div class="command-results" *ngIf="filteredCommands.length > 0">
      <div *ngFor="let category of categories" class="command-category">
        <div class="category-label">{{ category.label }}</div>
        
        <div
          *ngFor="let command of category.items; let i = index"
          class="command-item"
          [class.selected]="getGlobalIndex(categories.indexOf(category), i) === selectedIndex"
          (click)="executeCommand(command)"
          (mouseenter)="selectCommand(getGlobalIndex(categories.indexOf(category), i))">
          
          <div class="command-icon" *ngIf="command.icon">{{ command.icon }}</div>
          
          <div class="command-content">
            <div class="command-label" [innerHTML]="highlightMatch(command.label)"></div>
            <div class="command-description" *ngIf="command.description">{{ command.description }}</div>
          </div>

          <kbd class="command-shortcut" *ngIf="command.shortcut">{{ command.shortcut }}</kbd>
        </div>
      </div>
    </div>

    <!-- No Results -->
    <div class="command-empty" *ngIf="filteredCommands.length === 0 && searchQuery">
      <svg viewBox="0 0 24 24" width="48" height="48">
        <path fill="currentColor" d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
      </svg>
      <p>Nenhum comando encontrado</p>
    </div>

    <!-- Footer -->
    <div class="command-footer">
      <div class="footer-hint">
        <kbd>↑</kbd><kbd>↓</kbd> navegar
        <kbd>↵</kbd> selecionar
        <kbd>ESC</kbd> fechar
      </div>
    </div>
  </div>
</div>
