<div class="loading-overlay" 
     *ngIf="isLoading" 
     [class.with-backdrop]="backdrop"
     [attr.data-size]="size">
  
  <div class="loading-container">
    <!-- Coração Batendo -->
    <div class="heart-loader" [attr.data-color]="color">
      <svg class="heart-icon" viewBox="0 0 32 29.6" xmlns="http://www.w3.org/2000/svg">
        <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
          c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
      </svg>
    </div>

    <!-- Mensagem de Loading -->
    <div class="loading-message" *ngIf="showMessage">
      <p class="message-text">{{ message }}</p>
      <div class="message-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>
</div>
