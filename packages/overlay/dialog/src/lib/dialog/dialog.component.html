<div class="muxima--dialog-backdrop" *ngIf="isOpen">
  <div class="muxima--dialog-content">
    <header class="muxima--dialog-header">
      <div class="muxima--dialog-header-left">
        <!-- <div *ngIf="icon" class="muxima--dialog-header-icon">
          <ng-container *ngTemplateOutlet="icon"></ng-container>
        </div> -->

        <div *ngIf="icon" class="muxima--dialog-header-icon">
          <img [src]="icon" alt="icon" >
        </div>
        <div class="muxima-dialog-header-titles">
          <span class="muxima--dialog-title">{{title}}</span>
          <span *ngIf="subtitle" class="muxima--dialog-subtitle">{{subtitle}}</span>
        </div>
      </div>
      <button class="close--btn" (click)="close()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#505151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </header>

    <div class="muxima--dialog-outlet">
      <ng-content></ng-content>
    </div>

  </div>
</div>
