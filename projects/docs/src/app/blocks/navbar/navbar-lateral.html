<div class="app">
  <mx-sidebar #menu="mxSidebar" [(collapsed)]="recolhida" aria-label="Principal" class="lateral">
    <div mxSidebarHeader>
      <button mxSidebarToggle [sidebar]="menu">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" width="16" height="16">
          <path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
      <strong class="marca">Kianda</strong>
    </div>

    <mx-sidebar-group label="Gestão">
      @for (i of gestao; track i.id) {
        <li>
          <button
            mxSidebarItem
            type="button"
            [attr.aria-current]="activo() === i.id ? 'page' : null"
            (click)="activo.set(i.id)"
          >
            <svg mxSidebarIcon viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path [attr.d]="i.icone" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span mxSidebarLabel>{{ i.nome }}</span>
            @if (i.contagem) {
              <span mxSidebarBadge>{{ i.contagem }}<span class="mx-visually-hidden"> por pagar</span></span>
            }
          </button>
        </li>
      }
    </mx-sidebar-group>

    <mx-sidebar-group label="Empresa">
      @for (i of conta; track i.id) {
        <li>
          <button
            mxSidebarItem
            type="button"
            [attr.aria-current]="activo() === i.id ? 'page' : null"
            (click)="activo.set(i.id)"
          >
            <svg mxSidebarIcon viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path [attr.d]="i.icone" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span mxSidebarLabel>{{ i.nome }}</span>
          </button>
        </li>
      }
    </mx-sidebar-group>

    <div mxSidebarFooter>
      <mx-avatar name="Ana Kiala" size="sm" />
      <span mxSidebarLabel class="pessoa">
        <span class="pessoa-nome">Ana Kiala</span>
        <span class="pessoa-email">ana&#64;kianda.ao</span>
      </span>
    </div>
  </mx-sidebar>

  <div class="conteudo">
    <header class="topo">
      <h1 class="topo-titulo">{{ titulo() }}</h1>
      <form class="pesquisa" role="search" (submit)="$event.preventDefault()">
        <input mxInput size="sm" type="search" placeholder="Pesquisar" aria-label="Pesquisar" />
      </form>
      <button mxButton size="sm" type="button">Nova factura</button>
    </header>
    <div class="area">
      <div class="lugar"></div>
      <div class="lugar"></div>
      <div class="lugar lugar-largo"></div>
    </div>
  </div>
</div>
