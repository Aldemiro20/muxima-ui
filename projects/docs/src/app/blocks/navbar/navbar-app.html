<header class="app-bar">
  <a class="app-logo" href="#painel">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2" y="2" width="20" height="20" rx="6" fill="currentColor" />
      <path d="M8 16V8l4 4 4-4v8" fill="none" stroke="var(--mx-on-ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span class="app-logo-text">Kianda</span>
  </a>

  <form class="app-search" role="search" (submit)="pesquisar($event)">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3" />
      <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
    </svg>
    <input
      mxInput
      type="search"
      placeholder="Pesquisar clientes, facturas..."
      aria-label="Pesquisar"
      [value]="pesquisa()"
      (input)="pesquisa.set($any($event.target).value)"
    />
  </form>

  <div class="app-actions">
    <button
      type="button"
      class="app-icon-button"
      [attr.aria-label]="porLer() ? 'Notificações, ' + porLer() + ' por ler' : 'Notificações'"
      (click)="porLer.set(0); ultimaAccao.set('Notificações abertas')"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4 11V7a4 4 0 018 0v4l1.5 1.5h-11zM6.5 13.5a1.5 1.5 0 003 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
      </svg>
      @if (porLer()) {
        <span class="app-dot" aria-hidden="true">{{ porLer() }}</span>
      }
    </button>

    <button type="button" class="app-account" [mxMenuTriggerFor]="conta" aria-label="Conta de Ana Kiala">
      <mx-avatar [name]="utilizador.nome" size="sm" decorative />
      <svg class="app-chevron" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4.5 6.5L8 10l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <ng-template #conta>
      <div mxMenu>
        <div class="app-menu-head" aria-hidden="true">
          <strong>{{ utilizador.nome }}</strong>
          <span>{{ utilizador.email }}</span>
        </div>
        <hr mxSeparator />
        <button mxMenuItem (mxMenuItemTriggered)="ultimaAccao.set('Perfil')">Perfil</button>
        <button mxMenuItem (mxMenuItemTriggered)="ultimaAccao.set('Definições')">Definições</button>
        <button mxMenuItem (mxMenuItemTriggered)="ultimaAccao.set('Ajuda')">Ajuda</button>
        <hr mxSeparator />
        <button mxMenuItem variant="destructive" (mxMenuItemTriggered)="ultimaAccao.set('Terminar sessão')">
          Terminar sessão
        </button>
      </div>
    </ng-template>
  </div>
</header>

<!-- conteúdo de exemplo, só para dar contexto à barra -->
<div class="app-content">
  <h2 class="app-content-title">Bom dia, Ana</h2>
  <p class="app-content-text" role="status">{{ ultimaAccao() || 'Tens 3 facturas a vencer esta semana.' }}</p>
  <div class="app-content-cards" aria-hidden="true"><span></span><span></span><span></span></div>
</div>
