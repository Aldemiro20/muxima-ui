<div class="app">
  <mx-sidebar #menu="mxSidebar" [(collapsed)]="collapsed" aria-label="Main" class="lateral">
    <div mxSidebarHeader>
      <button mxSidebarToggle [sidebar]="menu">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" width="16" height="16">
          <path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
      <strong class="brand">Kianda</strong>
    </div>

    <mx-sidebar-group label="Management">
      @for (i of management; track i.id) {
        <li>
          <button
            mxSidebarItem
            type="button"
            [attr.aria-current]="active() === i.id ? 'page' : null"
            (click)="active.set(i.id)"
          >
            <svg mxSidebarIcon viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path [attr.d]="i.icon" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span mxSidebarLabel>{{ i.name }}</span>
            @if (i.count) {
              <span mxSidebarBadge>{{ i.count }}<span class="mx-visually-hidden"> unpaid</span></span>
            }
          </button>
        </li>
      }
    </mx-sidebar-group>

    <mx-sidebar-group label="Company">
      @for (i of account; track i.id) {
        <li>
          <button
            mxSidebarItem
            type="button"
            [attr.aria-current]="active() === i.id ? 'page' : null"
            (click)="active.set(i.id)"
          >
            <svg mxSidebarIcon viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path [attr.d]="i.icon" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span mxSidebarLabel>{{ i.name }}</span>
          </button>
        </li>
      }
    </mx-sidebar-group>

    <div mxSidebarFooter>
      <mx-avatar name="Ana Kiala" size="sm" />
      <span mxSidebarLabel class="person">
        <span class="person-name">Ana Kiala</span>
        <span class="person-email">ana&#64;kianda.ao</span>
      </span>
    </div>
  </mx-sidebar>

  <div class="content">
    <header class="top">
      <h1 class="top-title">{{ title() }}</h1>
      <form class="search" role="search" (submit)="$event.preventDefault()">
        <input mxInput size="sm" type="search" placeholder="Search" aria-label="Search" />
      </form>
      <button mxButton size="sm" type="button">New invoice</button>
    </header>
    <div class="area">
      <div class="place"></div>
      <div class="place"></div>
      <div class="place place-wide"></div>
    </div>
  </div>
</div>
