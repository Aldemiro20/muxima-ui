<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Muxima UI — Accessible Angular components</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Muxima UI is a free, open source library of 48 accessible Angular 21+ components, with themes, dark mode and documentation in English and Portuguese." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Muxima UI" />
    <meta property="og:title" content="Muxima UI — Accessible Angular components" />
    <meta property="og:description" content="Muxima UI is a free, open source library of 48 accessible Angular 21+ components, with themes, dark mode and documentation in English and Portuguese." />
    <meta property="og:url" content="https://muxima-ui.pages.dev/" />
    <meta property="og:image" content="https://muxima-ui.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Muxima UI: accessible Angular components, with screenshots of a dashboard and a school management app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Aplica o modo escolhido antes da primeira pintura, para evitar o "flash".
      try {
        var t = localStorage.getItem('muxima-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <script>
      // Estilos do site, depois dos da biblioteca (que o Angular põe no fim do <head>).
      // As páginas de pré-visualização de blocos (/blocks/view/..., /pt/blocos/ver/...)
      // ficam só com o muxima.css, como numa aplicação real.
      if (!/^\/(pt\/blocos\/ver|blocks\/view)\//.test(location.pathname)) {
        document.write('<link rel="stylesheet" href="docs.css" />');
      }
    </script>
    <doc-root></doc-root>
  </body>
</html>
