<div class="doc-layout" [class.sidebar-closed]="!isSidebarOpen">
  <!-- Header -->
  <header class="doc-header">
    <button class="menu-toggle" (click)="toggleSidebar()">
      <span class="icon">☰</span>
    </button>
    <div class="logo">
      <h1>🌺 Muxima UI</h1>
      <span class="version">v1.0.0</span>
    </div>
    <div class="header-actions">
      <muxima-theme-selector></muxima-theme-selector>
      <a href="https://github.com/seu-usuario/muxima-ui" target="_blank" class="github-link">
        <span class="icon">⭐</span> GitHub
      </a>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="doc-sidebar" [class.open]="isSidebarOpen">
    <nav class="sidebar-nav">
      <div *ngFor="let section of navigation" class="nav-section">
        <h3 class="section-title">{{ section.section }}</h3>
        <ul class="nav-items">
          <li *ngFor="let item of section.items">
            <a 
              [routerLink]="item.route" 
              routerLinkActive="active"
              [routerLinkActiveOptions]="{exact: item.route === '/'}"
              class="nav-link">
              <span class="nav-icon" [innerHTML]="item.icon | safeHtml"></span>
              <span class="nav-label">{{ item.label }}</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="doc-content">
    <router-outlet></router-outlet>
  </main>
</div>
